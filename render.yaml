services:
  - type: web
    name: telegram-odoo-agent
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_SECRET_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODELS
        value: meta/llama-3.3-70b-instruct,meta/llama-3.1-8b-instruct,mistralai/mixtral-8x22b-instruct,qwen/qwen2.5-72b-instruct
